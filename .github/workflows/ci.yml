name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'  # weekly: catches opencode upstream hook renames
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save @opencode-ai/plugin@latest
      - run: npm test
      - name: Hook still exists in opencode
        run: grep -rq "experimental.chat.system.transform" node_modules/@opencode-ai/plugin
